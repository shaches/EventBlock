name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4.2.2
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Verify tag matches project version
      run: |
        chmod +x ./gradlew
        version="$(./gradlew -q printVersion)"
        expected_tag="v${version}"
        if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}; expected ${expected_tag}."
          exit 1
        fi

    - name: Run release gates
      run: ./gradlew --no-daemon ci

    - name: Build reproducible plugin jar
      run: ./gradlew --no-daemon clean shadowJar -x test

    - name: Generate checksums
      run: |
        version="$(./gradlew -q printVersion)"
        cd build/libs
        jar="EventBlock-${version}.jar"
        test -f "$jar"
        sha256sum "$jar" > "$jar.sha256"
        md5sum "$jar" > "$jar.md5"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/libs/EventBlock-*.jar
          build/libs/EventBlock-*.jar.sha256
          build/libs/EventBlock-*.jar.md5
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}