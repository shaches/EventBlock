name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4.2.2
      # Fetch full history so Spotless `ratchetFrom=origin/main` can diff
      # the PR head against the base branch.
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4.2.2
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Full `verify` with the `ci` profile activates deterministic release gates:
    #   - JUnit 5 tests (Surefire)
    #   - Spotless googleJavaFormat
    #   - JaCoCo coverage report (target/site/jacoco/)
    #   - SpotBugs + FindSecBugs static analysis
    #   - maven-shade produces the plugin jar under target/
    - name: Build and run CI gates
      run: mvn -B -Pci verify

    - name: Upload plugin jar
      uses: actions/upload-artifact@v4
      with:
        name: plugin-jar
        path: target/EventBlock-*.jar

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/

    - name: Upload Surefire test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: target/surefire-reports/