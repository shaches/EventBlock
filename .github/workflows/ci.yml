name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4.2.2
      # Fetch full history so Spotless `ratchetFrom=origin/main` can diff
      # the PR head against the base branch.
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4.2.2
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    # Full `ci` runs deterministic release gates:
    #   - JUnit 5 tests
    #   - Spotless googleJavaFormat
    #   - JaCoCo coverage report (build/reports/jacoco/test/html/)
    #   - SpotBugs + FindSecBugs static analysis
    #   - Shadow produces the plugin jar under build/libs/
    - name: Build and run CI gates
      run: |
        chmod +x ./gradlew
        ./gradlew --no-daemon ci

    - name: Upload plugin jar
      uses: actions/upload-artifact@v4
      with:
        name: plugin-jar
        path: build/libs/EventBlock-*.jar

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/html/

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: build/test-results/test/